<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#79182b">
  <meta name="description" content="あなたの学年・学科に合わせた時間割を確認できるキャンパスポータル。">
  <title>Campus — キャンパスポータル</title>
  <link rel="stylesheet" href="./styles.css">
  <script>
    (function() {
      try {
        var m = document.cookie.match(/(?:^|; )campus-theme=([^;]*)/);
        var t = m ? decodeURIComponent(m[1]) : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <aside class="sidebar" id="sidebar" aria-label="メニュー">
    <button class="menu-close" id="menu-close" type="button" aria-label="メニューを閉じる">×</button>
    <a class="brand" href="#home"><span class="brand-icon" data-icon="school"></span><span class="brand-text"><span class="brand-title">Akashi KOSEN<br>学生ページ(仮)</span><small>Co+work 6班</small></span></a>
    <nav aria-label="メインナビゲーション">
      <a href="#home" id="home" data-page="home"><span data-icon="home"></span>ホーム</a>
      <a href="#timetable" id="timetable" data-page="timetable"><span data-icon="calendar"></span>時間割<span class="nav-dot"></span></a>
      <a href="#exam" id="exam" data-page="exam"><span data-icon="document"></span>定期試験</a>
      <a href="#calendar" id="calendar" data-page="calendar"><span data-icon="calendar"></span>年間予定</a>
      <a href="#cafeteria" id="cafeteria" data-page="cafeteria"><span data-icon="utensils"></span>食堂メニュー</a>
      <a href="#links" id="links" data-page="links"><span data-icon="book"></span>リンク・シラバス</a>
    </nav>
  </aside>
  <button id="menu-overlay" class="menu-overlay" aria-label="メニューを閉じる" tabindex="-1" hidden></button>
  <div class="workspace">
    <button id="menu-toggle" class="menu-toggle floating-menu-toggle" type="button" aria-label="メニューを開く" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
    <main id="main" tabindex="-1"></main>
    <footer>Co+work 6班 <span>令和8年度後期の時間割</span></footer>
  </div>
</body>
</html>
